name: paraformer
channels:
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.3.1
      - torchaudio==2.3.1
      - "funasr>=1.1.0,<1.2.0"   # 1.3.x 与 vocab8404 ckpt 不兼容（见 README §11 Q8）
      - modelscope>=1.16.0
      - jiwer>=3.0.0
      - pyarrow>=15.0.0
      - datasets>=2.18.0
      - soundfile>=0.12.1
      - librosa>=0.10.1
      - tensorboard
      - tqdm
      - huggingface_hub>=0.23.0
